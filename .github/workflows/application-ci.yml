name: DAJC CZ Application CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cz-application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cz-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Production build
        run: npm run build
